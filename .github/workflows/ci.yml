name: CI
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [develop, 'release-candidates/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' || github.event.action == 'opened' }}
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name == 'pull_request' && github.base_ref == 'master' && github.event.pull_request.user.login == 'dependabot[bot]'
        run: |
          echo 'Dependency updates must first merge into develop. Perform a Master Release to propagate approved dependency changes to master.'
          exit 1
  tests:
    needs: guard
    uses: ./.github/workflows/test.yml
  quality:
    needs: guard
    uses: ./.github/workflows/release-validation.yml
  candidate-vars:
    if: startsWith(github.head_ref || github.ref_name, 'release-candidates/')
    needs: [tests, quality]
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.identity.outputs.source }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: identity
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE"
          version=$(cat VERSION)
          RELEASE_VERSION="$version" python -c "from scripts.release import version; import os; version(os.environ['RELEASE_VERSION'])"
          test "$(cat BUILDNUM)" = 0
          test "$(git ls-remote --refs origin "refs/heads/release-candidates/$version" | cut -f1)" = "$SOURCE"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
  candidate-images:
    needs: candidate-vars
    uses: ./.github/workflows/docker-build.yml
    with:
      source_sha: ${{ needs.candidate-vars.outputs.source }}
  candidate-executables:
    needs: candidate-vars
    uses: ./.github/workflows/release-executables.yml
    with:
      source_sha: ${{ needs.candidate-vars.outputs.source }}
      tag: ${{ needs.candidate-vars.outputs.tag }}
  pr-identity:
    if: >-
      github.event_name == 'pull_request' &&
      (contains(github.event.pull_request.labels.*.name, 'build') ||
       contains(github.event.pull_request.labels.*.name, 'build-full'))
    needs: [tests, quality]
    runs-on: ubuntu-latest
    outputs:
      namespace: ${{ steps.identity.outputs.namespace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: identity
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          python -c "from scripts.pr_artifacts import artifact_name; import os; print('namespace=' + artifact_name(int(os.environ['PR_NUMBER']), os.environ['HEAD_SHA'], os.environ['HEAD_REF']))" >> "$GITHUB_OUTPUT"
  pr-image:
    needs: pr-identity
    uses: ./.github/workflows/docker-build.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
      full_build: ${{ contains(github.event.pull_request.labels.*.name, 'build-full') }}
      artifact_prefix: ${{ needs.pr-identity.outputs.namespace }}
  ci-status:
    runs-on: ubuntu-latest
    needs: [guard, tests, quality, candidate-vars, candidate-images, candidate-executables]
    if: always()
    steps:
      - name: Require complete validation
        env:
          RESULTS: ${{ toJSON(needs) }}
          IS_CANDIDATE: ${{ startsWith(github.head_ref || github.ref_name, 'release-candidates/') }}
        run: |
          echo "$RESULTS" | jq -e --argjson candidate "$IS_CANDIDATE" 'all(to_entries[]; if (.key | startswith("candidate-")) and ($candidate | not) then .value.result == "skipped" else .value.result == "success" end)'
