name: Hotfix Release

# Hotfixes integrate through develop and use the reviewed candidate path.
# Closing a PR must never create a release implicitly.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instructions:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Integrate the fix into develop, then use Master Release (prepare, review, promote).'
          echo 'hotfix and master are release targets; see docs/releasing.md.'
