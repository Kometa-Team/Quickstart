name: Lint

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set Up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci --no-fund --no-audit

      - name: Cache Pre-commit Environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install Pre-commit
        run: python -m pip install --upgrade pip pre-commit

      - name: Run Pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  vitest:
    name: Vitest
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Set Up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci --no-fund --no-audit

      - name: Run Vitest
        run: npm test

  vite-build:
    name: Vite Build
    runs-on: ubuntu-latest

    # Verifies that `npm run build` produces bundles for every ES-module
    # entry point in static/local-js/. The build output is NOT shipped
    # anywhere today -- Flask still serves raw source files (see the
    # `frontend tooling` section of README.md) -- but running the build
    # in CI keeps it green so that when a downstream PR (Step 6 Alpine,
    # Step 9 Svelte islands) flips the template switch, the bundle
    # already works.
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Set Up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci --no-fund --no-audit

      - name: Run Vite Build
        run: npm run build

      - name: Verify expected entries were built
        run: |
          # Sanity check that Vite's auto-discovery didn't silently drop
          # a page-scale module. If someone lands a PR that renames or
          # deletes one of these files without updating this list, CI
          # will fail loudly instead of silently producing a broken build.
          #
          # Filenames are hashed for cache busting (e.g. 000-base-DKccW2Od.js),
          # so we check the manifest keys rather than filesystem entries.
          set -euo pipefail
          MANIFEST=static/dist/.vite/manifest.json
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Vite manifest missing at $MANIFEST"
            exit 1
          fi
          MISSING=0
          for entry in 000-base 001-start 010-plex 025-libraries 900-kometa \
                       905-analytics eventHandler overlayHandler; do
            KEY="static/local-js/${entry}.js"
            if ! python3 -c "import json,sys; sys.exit(0 if '${KEY}' in json.load(open('${MANIFEST}')) else 1)"; then
              echo "::error::Vite manifest missing entry: ${KEY}"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "Manifest keys present:"
            python3 -c "import json; print('\n'.join(sorted(json.load(open('${MANIFEST}')).keys())))"
            exit 1
          fi
