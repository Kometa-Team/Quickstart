name: Docker Build Artifacts
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      full_build:
        type: boolean
        default: true
      artifact_prefix:
        type: string
        default: image
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            dockerfile: Dockerfile
          - arch: arm64
            platform: linux/arm64
            dockerfile: Dockerfile
          - arch: armv7
            platform: linux/arm/v7
            dockerfile: Dockerfile.arm7
    steps:
      - name: Require immutable source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARTIFACT_PREFIX" == image || "$ARTIFACT_PREFIX" =~ ^pr-[1-9][0-9]*-$SOURCE_SHA$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.full_build || matrix.arch == 'amd64'
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: inputs.full_build || matrix.arch == 'amd64'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: inputs.full_build || matrix.arch == 'amd64'
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: inputs.full_build || matrix.arch == 'amd64'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: BRANCH_NAME=master
          labels: org.opencontainers.image.revision=${{ inputs.source_sha }}
          tags: quickstart-build:${{ inputs.source_sha }}-${{ matrix.arch }}
          push: false
          provenance: false
          sbom: false
          outputs: type=docker,dest=${{ runner.temp }}/image-${{ matrix.arch }}.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.full_build || matrix.arch == 'amd64'
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 14
