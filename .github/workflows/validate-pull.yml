name: Validate Pull Request

# Disabled: workflow_dispatch is a placeholder to keep this file registered, not a working trigger (pull_request is undefined here). Rollback = restore pull_request_target below, then delete once ci.yml is proven.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  validate-changes:
    name: Validate Changes
    runs-on: ubuntu-latest
    outputs:
      part: ${{ steps.list-changes.outputs.part }}
      build: ${{ steps.list-changes.outputs.build }}
    steps:

      - name: Display Refs
        env:
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Base Repo: $BASE_REPO"
          echo "Base Ref: $BASE_REF"
          echo "Head Repo: $HEAD_REPO"
          echo "Head Ref: $HEAD_REF"

      - name: Check for Remote Branch
        if: "!contains(github.event.pull_request.labels.*.name, 'approved')"
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          repo_name="$HEAD_REPO"
          base_name="${repo_name%/*}"

          if [[ "${base_name}" != "Kometa-Team" ]]; then
              echo "ERROR: Pull Requests must be approved before they can run workflows"
              exit 1
          fi

      - name: Create App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_TOKEN }}

      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Check Base Branch
        if: github.base_ref == 'master'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr close "$PR_NUMBER" --comment "Pull Requests cannot be submitted to master. Please resubmit the Pull Request to the develop branch."
          echo "ERROR: Pull Requests cannot be submitted to master. Please resubmit the Pull Request to the develop branch"
          exit 1

      - name: Get Changes
        id: get-changes
        env:
          REPO_NAME: ${{ vars.REPO_NAME }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          git remote add -f upstream "https://github.com/Kometa-Team/${REPO_NAME}.git"
          git remote update
          if [[ "$EVENT_ACTION" == "labeled" ]]; then
              echo "files=$(git diff --name-only upstream/develop HEAD | xargs)" >> $GITHUB_OUTPUT
          else
              echo "files=$(git diff --name-only HEAD^ | xargs)" >> $GITHUB_OUTPUT
          fi

      - name: List Changed Files
        id: list-changes
        env:
          CHANGED_FILES: ${{ steps.get-changes.outputs.files }}
        run: |
          for file in $CHANGED_FILES; do
              if [[ $file =~ ^(PART).*$ ]] ; then
                  echo "build=true" >> $GITHUB_OUTPUT
              elif [[ $file =~ ^(modules|static|templates|quickstart.py|requirements.txt|.dockerignore|Dockerfile).*$ ]] ; then
                  echo "$file will trigger builds"
                  echo "part=true" >> $GITHUB_OUTPUT
              else
                  echo "$file will not trigger builds"
              fi
          done

      - name: Run Spellcheck on Changed Files
        id: spellcheck
        uses: rojopolis/spellcheck-github-actions@0.64.0
        with:
          task_name: Markdown
          source_files: ${{ steps.get-changes.outputs.files }}


  format-code:
    name: Format Code and Add Part File
    if: needs.validate-changes.outputs.build != 'true' && needs.validate-changes.outputs.part == 'true'
    runs-on: ubuntu-latest
    needs: [ validate-changes ]
    permissions:
      contents: write
    steps:

      - name: Create App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_TOKEN }}

      - name: Check Out Repo
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Format Code
        id: format-code
        run: |
            pip install -r requirements.txt
            pip install -r requirements-dev.txt
            black . -l 180

      - name: Update PART File and Commit
        id: update-version
        if: contains(github.event.pull_request.labels.*.name, 'build') || contains(github.event.pull_request.labels.*.name, 'build-full')
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          branch_name="$HEAD_REF"
          repo_name="$HEAD_REPO"
          base_name="${repo_name%/*}"
          if [[ "${branch_name}" =~ ^(master|develop)$ ]]; then
              tag_name="${base_name}"
          else
              tag_name="${branch_name}"
          fi
          echo "tag-name=${tag_name}" >> $GITHUB_OUTPUT

          if [[ "${base_name}" == "Kometa-Team" ]]; then
              extra=""
          else
              extra=" from the ${repo_name} repo"
          fi
          echo "extra-text=${extra}" >> $GITHUB_OUTPUT

          old_msg=$(git log -1 HEAD --pretty=format:%s)
          echo "commit-msg=${old_msg}" >> $GITHUB_OUTPUT

          part=$(cat PART 2>/dev/null || echo "")
          if [ -n "$part" ]; then
              new_value="$((${part} + 1))"
          else
              new_value="1"
          fi

          echo "part_value=${new_value}" >> $GITHUB_OUTPUT

          echo "$new_value" > "PART"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "${tag_name} Part: ${new_value}"
          git push

      - name: Check Diff
        id: verify_diff
        run: |
            git diff --quiet . || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit Code Format Changes
        if: steps.verify_diff.outputs.changed == 'true' && !contains(github.event.pull_request.labels.*.name, 'build') && !contains(github.event.pull_request.labels.*.name, 'build-full')
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Code Format"
          git push


  run-tests:
    name: Run Test Suite
    runs-on: ubuntu-latest
    if: needs.validate-changes.outputs.part == 'true' || needs.validate-changes.outputs.build == 'true'
    needs: [ validate-changes ]
    steps:

      - name: Check Out Repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Tests
        run: python -m pytest


  get-version:
    name: Get Version
    runs-on: ubuntu-latest
    if: needs.validate-changes.outputs.build == 'true'
    outputs:
      tag-name: ${{ steps.get-data.outputs.tag-name }}
      version: ${{ steps.get-data.outputs.version }}
      part: ${{ steps.get-data.outputs.part }}
    needs: [ validate-changes ]
    steps:

      - name: Create App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_TOKEN }}

      - name: Check Out Repo
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Get Version
        id: get-data
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          branch_name="$HEAD_REF"
          repo_name="$HEAD_REPO"
          base_name="${repo_name%/*}"
          if [[ "${branch_name}" =~ ^(master|develop)$ ]]; then
              tag_name="${base_name}"
          else
              tag_name="${branch_name}"
          fi
          echo "tag-name=${tag_name}" >> $GITHUB_OUTPUT
          echo "version=$(cat VERSION)-build$(cat BUILDNUM)" >> $GITHUB_OUTPUT
          part=$(cat PART 2>/dev/null || echo "")
          echo "part=${part}" >> $GITHUB_OUTPUT


  docker-build-pull:
    name: Docker
    uses: ./.github/workflows/docker-build.yml
    secrets: inherit
    needs: [ validate-changes, get-version ]
    if: needs.validate-changes.outputs.build == 'true'
    with:
      branch: ${{ github.event.pull_request.head.ref }}
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      branch_name: ${{ needs.get-version.outputs.tag-name }}
      tag_name: ${{ needs.get-version.outputs.tag-name }}
      full_build: ${{ contains(github.event.pull_request.labels.*.name, 'build-full') }}


  build-executable:
    name: Build ${{ matrix.os_upper }} Executable
    runs-on: ${{ matrix.os }}-${{ matrix.os_version }}
    if: needs.validate-changes.outputs.build == 'true'
    needs: [ validate-changes, get-version ]
    outputs:
      windows: ${{ steps.save-links.outputs.windows }}
      ubuntu: ${{ steps.save-links.outputs.ubuntu }}
      macos: ${{ steps.save-links.outputs.macos }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'windows'
            os_upper: 'Windows'
            os_version: 'latest'
            ext: '.exe'
          - os: 'ubuntu'
            os_upper: 'Linux'
            os_version: 'latest'
            ext: ''
          - os: 'macos'
            os_upper: 'MacOS'
            os_version: '13'
            ext: ''
    steps:

      - name: Check Out Repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build JS Bundles
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Requirements
        run: pip install -r requirements.txt pyinstaller

      - name: Build Executable
        id: build-executable
        shell: bash
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
          TAG_NAME: ${{ needs.get-version.outputs.tag-name }}
          PART: ${{ needs.get-version.outputs.part }}
          EXT: ${{ matrix.ext }}
        run: |
          filename="Quickstart-v${VERSION}.${TAG_NAME}${PART}-${RUNNER_OS}${EXT}"
          echo "filename=${filename}" >> $GITHUB_OUTPUT
          pyinstaller -y ./quickstart.spec -- --branch pull --build "${RUNNER_OS}"
          mv "dist/Quickstart${EXT}" "dist/${filename}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        id: artifact-upload-step
        with:
          name: ${{ steps.build-executable.outputs.filename }}
          path: dist/${{ steps.build-executable.outputs.filename }}

      - name: Save Links to Env Vars
        id: save-links
        shell: bash
        env:
          FILENAME: ${{ steps.build-executable.outputs.filename }}
          ARTIFACT_URL: ${{ steps.artifact-upload-step.outputs.artifact-url }}
          MATRIX_OS: ${{ matrix.os }}
        run: |
          link_text="[${FILENAME}](${ARTIFACT_URL})"
          echo "${MATRIX_OS}=${link_text}" >> $GITHUB_OUTPUT


  add-links:
    name: Add Links to PR
    runs-on: ubuntu-latest
    needs: [ get-version, build-executable ]
    permissions:
      pull-requests: write
    steps:

      - name: Create App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_TOKEN }}

      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Print Links
        env:
          WIN_LINK: ${{ needs.build-executable.outputs.windows }}
          UBUNTU_LINK: ${{ needs.build-executable.outputs.ubuntu }}
          MACOS_LINK: ${{ needs.build-executable.outputs.macos }}
        run: |
          echo "$WIN_LINK"
          echo "$UBUNTU_LINK"
          echo "$MACOS_LINK"

      - name: Generate Body
        id: generate-body
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_BODY_RAW: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WIN_LINK: ${{ needs.build-executable.outputs.windows }}
          UBUNTU_LINK: ${{ needs.build-executable.outputs.ubuntu }}
          MACOS_LINK: ${{ needs.build-executable.outputs.macos }}
          DOCKER_TEAM: ${{ vars.DOCKER_TEAM }}
          DOCKER_REPO: ${{ vars.DOCKER_REPO }}
          TAG_NAME: ${{ needs.get-version.outputs.tag-name }}
        run: |
          PR_BODY=$(echo "$PR_BODY_RAW" | sed -z 's/\n## Executables.*//')
          PR_BODY+=$'\n\n## Executables'
          PR_BODY+=$'\n\n**'"$WIN_LINK"'**'
          PR_BODY+=$'\n\n**'"$UBUNTU_LINK"'**'
          PR_BODY+=$'\n\n**'"$MACOS_LINK"'**'
          PR_BODY+=$'\n\n## Docker Image'
          PR_BODY+=$'\n\n**`'"$DOCKER_TEAM"'/'"$DOCKER_REPO"':'"$TAG_NAME"'`**'

          gh pr edit "$PR_NUMBER" --body "$PR_BODY"


  failure-notification:
    name: Failure Notification
    runs-on: ubuntu-latest
    needs: [ run-tests, get-version, build-executable, add-links ]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    steps:

      - name: Discord Failure Notification
        uses: Kometa-Team/discord-notifications@master
        with:
          webhook_id_token: ${{ secrets.BUILD_WEBHOOK }}
          message: "QS Broke Needs Fix"
          title: "${{ vars.NAME }} ${{ needs.get-version.outputs.tag-name }}: ${{ vars.TEXT_FAILURE }}"
          url: https://github.com/Kometa-Team/${{ vars.REPO_NAME }}/actions/runs/${{ github.run_id }}
          color: ${{ vars.COLOR_FAILURE }}
          username: ${{ vars.BOT_NAME }}
          avatar_url: ${{ vars.BOT_IMAGE }}
          author: ${{ vars.DOCKER_NAME }}
          author_icon_url: ${{ vars.DOCKER_IMAGE }}
