name: Validate Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  validate-changes:
    name: Validate Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      part: ${{ steps.list-changes.outputs.part }}
      build: ${{ steps.list-changes.outputs.build }}
    steps:

      - name: Display Refs
        run: |
          echo "Base Repo: ${{ github.event.pull_request.base.repo.full_name }}"
          echo "Base Ref: ${{ github.base_ref }}"
          echo "Head Repo: ${{ github.event.pull_request.head.repo.full_name }}"
          echo "Head Ref: ${{ github.event.pull_request.head.ref }}"

      - name: Check Base Branch
        if: github.base_ref == 'master'
        run: |
          echo "ERROR: Pull Requests cannot be submitted to master. Please resubmit the Pull Request to the develop branch."
          exit 1

      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get Changes
        id: get-changes
        run: |
          git remote add -f upstream "https://github.com/${{ github.repository }}.git"
          git remote update

          echo "files<<EOF" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event.action }}" == "labeled" ]]; then
            git diff --name-only upstream/develop HEAD >> "$GITHUB_OUTPUT"
          else
            git diff --name-only HEAD^ HEAD >> "$GITHUB_OUTPUT"
          fi

          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: List Changed Files
        id: list-changes
        env:
          CHANGED_FILES: ${{ steps.get-changes.outputs.files }}
        run: |
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            if [[ "$file" =~ ^PART$ ]]; then
              echo "$file will trigger a full build"
              echo "build=true" >> "$GITHUB_OUTPUT"
            elif [[ "$file" =~ ^(modules|static|templates|quickstart\.py|requirements\.txt|requirements-dev\.txt|package\.json|package-lock\.json|\.dockerignore|Dockerfile) ]]; then
              echo "$file will trigger builds"
              echo "part=true" >> "$GITHUB_OUTPUT"
            else
              echo "$file will not trigger builds"
            fi
          done <<< "$CHANGED_FILES"

      - name: Get Changed Markdown Files
        uses: tj-actions/changed-files@v47
        id: changed-files
        with:
          files: |
            **.md

      - name: Run Spellcheck on Changed Files
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: rojopolis/spellcheck-github-actions@0.64.0
        with:
          task_name: Markdown
          source_files: ${{ steps.changed-files.outputs.all_changed_files }}


  format-code:
    name: Format Code and Add Part File
    if: >-
      needs.validate-changes.outputs.build != 'true' &&
      needs.validate-changes.outputs.part == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: [validate-changes]
    permissions:
      contents: write
    steps:

      - name: Create App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_TOKEN }}

      - name: Check Out Repo
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Format Code
        id: format-code
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          black . -l 180

      - name: Update PART File and Commit
        id: update-version
        if: contains(github.event.pull_request.labels.*.name, 'build') || contains(github.event.pull_request.labels.*.name, 'build-full')
        run: |
          branch_name="${{ github.event.pull_request.head.ref }}"
          repo_name="${{ github.event.pull_request.head.repo.full_name }}"
          base_name="${repo_name%/*}"

          if [[ "${branch_name}" =~ ^(master|develop)$ ]]; then
            tag_name="${base_name}"
          else
            tag_name="${branch_name}"
          fi

          echo "tag-name=${tag_name}" >> "$GITHUB_OUTPUT"

          if [[ "${base_name}" == "Kometa-Team" ]]; then
            extra=""
          else
            extra=" from the ${{ github.event.pull_request.head.repo.full_name }} repo"
          fi

          echo "extra-text=${extra}" >> "$GITHUB_OUTPUT"

          old_msg=$(git log -1 HEAD --pretty=format:%s)
          echo "commit-msg=${old_msg}" >> "$GITHUB_OUTPUT"

          part=$(cat PART)
          if [[ -n "$part" ]]; then
            new_value=$((part + 1))
          else
            new_value="1"
          fi

          echo "part_value=${new_value}" >> "$GITHUB_OUTPUT"
          echo "$new_value" > PART

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add PART
          git commit -m "${tag_name} Part: ${new_value}"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Check Diff
        id: verify-diff
        run: |
          if ! git diff --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Code Format Changes
        if: >-
          steps.verify-diff.outputs.changed == 'true' &&
          !contains(github.event.pull_request.labels.*.name, 'build') &&
          !contains(github.event.pull_request.labels.*.name, 'build-full')
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Code Format"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"


  run-tests:
    name: Run Test Suite
    runs-on: ubuntu-latest
    if: needs.validate-changes.outputs.part == 'true' || needs.validate-changes.outputs.build == 'true'
    needs: [validate-changes]
    permissions:
      contents: read
    steps:

      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Tests
        run: pytest


  get-version:
    name: Get Version
    runs-on: ubuntu-latest
    if: >-
      needs.validate-changes.outputs.build == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      tag-name: ${{ steps.get-data.outputs.tag-name }}
      version: ${{ steps.get-data.outputs.version }}
      part: ${{ steps.get-data.outputs.part }}
    needs: [validate-changes]
    permissions:
      contents: read
    steps:

      - name: Check Out Repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Get Version
        id: get-data
        run: |
          branch_name="${{ github.event.pull_request.head.ref }}"
          repo_name="${{ github.event.pull_request.head.repo.full_name }}"
          base_name="${repo_name%/*}"

          if [[ "${branch_name}" =~ ^(master|develop)$ ]]; then
            tag_name="${base_name}"
          else
            tag_name="${branch_name}"
          fi

          echo "tag-name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "version=$(cat VERSION)-build$(cat BUILDNUM)" >> "$GITHUB_OUTPUT"
          echo "part=$(cat PART)" >> "$GITHUB_OUTPUT"


  docker-build-pull:
    name: Docker
    uses: ./.github/workflows/docker-build.yml
    secrets: inherit
    needs: [validate-changes, get-version]
    if: >-
      needs.validate-changes.outputs.build == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    with:
      branch: ${{ github.event.pull_request.head.ref }}
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      branch_name: ${{ needs.get-version.outputs.tag-name }}
      tag_name: ${{ needs.get-version.outputs.tag-name }}
      full_build: ${{ contains(github.event.pull_request.labels.*.name, 'build-full') }}


  build-executable:
    name: Build ${{ matrix.os_upper }} Executable
    runs-on: ${{ matrix.os }}-${{ matrix.os_version }}
    if: >-
      needs.validate-changes.outputs.build == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [validate-changes, get-version]
    permissions:
      contents: read
      actions: write
    outputs:
      windows: ${{ steps.save-links.outputs.windows }}
      ubuntu: ${{ steps.save-links.outputs.ubuntu }}
      macos: ${{ steps.save-links.outputs.macos }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            os_upper: Windows
            os_version: latest
            ext: .exe
          - os: ubuntu
            os_upper: Linux
            os_version: latest
            ext: ''
          - os: macos
            os_upper: MacOS
            os_version: '13'
            ext: ''
    steps:

      - name: Check Out Repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Build JS Bundles
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Requirements
        run: pip install -r requirements.txt pyinstaller

      - name: Build Executable
        id: build-executable
        shell: bash
        run: |
          filename="Quickstart-v${{ needs.get-version.outputs.version }}.${{ needs.get-version.outputs.tag-name }}${{ needs.get-version.outputs.part }}-${{ runner.os }}${{ matrix.ext }}"
          echo "filename=${filename}" >> "$GITHUB_OUTPUT"
          pyinstaller -y ./quickstart.spec -- --branch pull --build "${{ runner.os }}"
          mv "dist/Quickstart${{ matrix.ext }}" "dist/${filename}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        id: artifact-upload-step
        with:
          name: ${{ steps.build-executable.outputs.filename }}
          path: dist/${{ steps.build-executable.outputs.filename }}

      - name: Save Links to Env Vars
        id: save-links
        shell: bash
        run: |
          link_text="[${{ steps.build-executable.outputs.filename }}](${{ steps.artifact-upload-step.outputs.artifact-url }})"
          echo "${{ matrix.os }}=${link_text}" >> "$GITHUB_OUTPUT"


  add-links:
    name: Add Links to PR
    runs-on: ubuntu-latest
    needs: [get-version, build-executable]
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.get-version.result == 'success' &&
      needs.build-executable.result == 'success'
    permissions:
      contents: read
      pull-requests: write
    steps:

      - name: Create App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_TOKEN }}

      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Print Links
        run: |
          echo "${{ needs.build-executable.outputs.windows }}"
          echo "${{ needs.build-executable.outputs.ubuntu }}"
          echo "${{ needs.build-executable.outputs.macos }}"

      - name: Generate Body
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ORIGINAL_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          PR_BODY="$ORIGINAL_PR_BODY"
          PR_BODY=$(printf '%s' "$PR_BODY" | sed -z 's/\n## Executables.*//')

          PR_BODY+=$'\n\n## Executables'
          PR_BODY+=$'\n\n**${{ needs.build-executable.outputs.windows }}**'
          PR_BODY+=$'\n\n**${{ needs.build-executable.outputs.ubuntu }}**'
          PR_BODY+=$'\n\n**${{ needs.build-executable.outputs.macos }}**'
          PR_BODY+=$'\n\n## Docker Image'
          PR_BODY+=$'\n\n**`${{ vars.DOCKER_TEAM }}/${{ vars.DOCKER_REPO }}:${{ needs.get-version.outputs.tag-name }}`**'

          gh pr edit "${{ github.event.pull_request.number }}" --body "$PR_BODY"


  failure-notification:
    name: Failure Notification
    runs-on: ubuntu-latest
    needs: [run-tests, get-version, build-executable, add-links]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    steps:

      - name: Discord Failure Notification
        uses: Kometa-Team/discord-notifications@master
        with:
          webhook_id_token: ${{ secrets.BUILD_WEBHOOK }}
          message: ${{ vars.BUILD_FAILURE_ROLE }}
          title: "${{ vars.NAME }} ${{ needs.get-version.outputs.tag-name }}: ${{ vars.TEXT_FAILURE }}"
          url: https://github.com/Kometa-Team/${{ vars.REPO_NAME }}/actions/runs/${{ github.run_id }}
          color: ${{ vars.COLOR_FAILURE }}
          username: ${{ vars.BOT_NAME }}
          avatar_url: ${{ vars.BOT_IMAGE }}
          author: ${{ vars.DOCKER_NAME }}
          author_icon_url: ${{ vars.DOCKER_IMAGE }}
