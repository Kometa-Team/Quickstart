name: Increment Build

on:
  pull_request_target:
    branches: [ develop ]
    types: [ closed ]

concurrency:
  group: increment-build-develop
  cancel-in-progress: false

jobs:

  verify-changes:
    name: Verify Changes
    runs-on: ubuntu-latest
    if: github.base_ref == 'develop' && github.event.pull_request.merged
    outputs:
      build: ${{ steps.list-changes.outputs.build }}
    steps:

      - name: Display Refs
        env:
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Base Repo: ${BASE_REPO}"
          echo "Base Ref: ${BASE_REF}"
          echo "Head Repo: ${HEAD_REPO}"
          echo "Head Ref: ${HEAD_REF}"

      - name: Check Out Repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: develop

      - name: List changed files
        id: list-changes
        # File names come straight from git (NUL-separated) and never pass through a step output or an inline expression.
        run: |
          set -euo pipefail
          git diff -z --name-only HEAD^ | while IFS= read -r -d '' file; do
              if [[ "$file" =~ ^(modules|static|templates|quickstart.py|requirements.txt|.dockerignore|Dockerfile).*$ ]]; then
                  echo "docker build trigger: $file"
                  echo "build=true" >> "$GITHUB_OUTPUT"
              else
                  echo "no docker build: $file"
              fi
          done


  increment-build:
    name: Increment Build
    runs-on: ubuntu-latest
    needs: [ verify-changes ]
    if: needs.verify-changes.outputs.build == 'true'
    outputs:
      version: ${{ steps.update-version.outputs.version }}
      build-value: ${{ steps.update-version.outputs.build-value }}
      commit-msg: ${{ steps.update-version.outputs.commit-msg }}
      commit-hash: ${{ steps.update-version.outputs.commit-hash }}
      commit-short: ${{ steps.update-version.outputs.commit-short }}
    steps:

      - name: Create App Token
        uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_TOKEN }}

      - name: Check Out Repo
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: develop
          fetch-depth: 0

      - name: Update VERSION File
        id: update-version
        run: |
          version=$(cat VERSION)
          build_value=$(cat BUILDNUM)
          next_build_value="$((${build_value} + 1))"

          old_msg=$(git log -1 HEAD --pretty=format:%s)
          new_msg="[${next_build_value}] ${old_msg}"

          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "build-value=${next_build_value}" >> $GITHUB_OUTPUT
          echo "commit-msg=${old_msg}" >> $GITHUB_OUTPUT
          echo "commit-short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

          echo "$next_build_value" > "BUILDNUM"
          echo "" > "PART"
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add BUILDNUM
          git add PART

          # Plain commit + push, not --amend/--force-with-lease -- concurrency group increment-build-develop already serializes runs, so a normal push is safe; retry loop is just a safety net.
          git commit -m "${new_msg}"

          push_ok=false
          for attempt in 1 2 3; do
            if git push origin develop; then
              push_ok=true
              break
            fi
            echo "Push rejected (attempt ${attempt}); fetching and rebasing before retry."
            git fetch origin develop
            git rebase origin/develop
          done

          if [ "$push_ok" != "true" ]; then
            echo "::error::Could not push the build-number commit to develop after 3 attempts."
            exit 1
          fi

          hash=$(git rev-parse HEAD)
          echo "$hash"
          echo "commit-hash=${hash}" >> $GITHUB_OUTPUT


  create-pre-release:
    name: Create Pre-Release
    runs-on: ubuntu-latest
    needs: [ increment-build ]
    steps:

      - name: Create App Token
        uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_TOKEN }}

      - name: Check Out Repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: develop

      - name: Build Changelog
        run: |
          {
            echo "## Commits"
            echo ""
            git log v${{ needs.increment-build.outputs.version }}..HEAD --pretty=format:'* [`%h`](https://github.com/Kometa-Team/Quickstart/commit/%H): %s (@%an)'
            echo ""
            echo "[**Full Code Changelog**](https://github.com/Kometa-Team/Quickstart/compare/v${{ needs.increment-build.outputs.version }}...prerelease)"
          } > changelog.md

      - name: Create Pre-Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          cat changelog.md

          if gh release view prerelease > /dev/null 2>&1; then
            gh release delete prerelease --cleanup-tag
            sleep 60
          fi

          gh release create prerelease --prerelease \
            --title "${{ vars.NAME }} ${{ needs.increment-build.outputs.version }} Develop Build ${{ needs.increment-build.outputs.build-value }}" \
            --notes-file changelog.md \
            --target "${{ needs.increment-build.outputs.commit-hash }}"

      - name: Discord Failure Notification
        uses: Kometa-Team/discord-notifications@master
        if: failure()
        with:
          webhook_id_token: ${{ secrets.BUILD_WEBHOOK }}
          message: ${{ vars.BUILD_FAILURE_ROLE }}
          title: "${{ vars.NAME }} develop: **Release Failed**"
          url: https://github.com/Kometa-Team/${{ vars.REPO_NAME }}/actions/runs/${{ github.run_id }}
          color: ${{ vars.COLOR_FAILURE }}
          username: ${{ vars.BOT_NAME }}
          avatar_url: ${{ vars.BOT_IMAGE }}
          author: ${{ vars.DOCKER_NAME }}
          author_icon_url: ${{ vars.DOCKER_IMAGE }}

  docker-build-develop:
    name: Docker
    uses: ./.github/workflows/docker-build.yml
    secrets: inherit
    needs: [ increment-build ]
    with:
      branch: develop
      branch_name: develop
      tag_name: develop
