name: Increment Build
on:
  pull_request_target:
    branches: [develop]
    types: [closed]
permissions:
  contents: read
concurrency:
  group: quickstart-release-writer
  cancel-in-progress: false
jobs:
  verify-changes:
    if: >-
      github.base_ref == 'develop' && github.event.pull_request.merged &&
      !startsWith(github.event.pull_request.head.ref, 'release-candidates/') &&
      !startsWith(github.event.pull_request.head.ref, 'automation/build-')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.build.outputs.changed }}
      sha: ${{ steps.build.outputs.sha }}
      branch: ${{ steps.build.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare a reviewable build-number PR, never write develop
        id: build
        env:
          MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          current=$(git ls-remote --refs origin refs/heads/develop | cut -f1)
          if [ "$current" != "$MERGED_SHA" ]; then
            echo 'Integration moved; skip this stale build-number event.'
            exit 0
          fi
          if ! git diff --name-only HEAD^ HEAD | grep -Eq '^(modules/|static/|templates/|quickstart.py$|requirements.txt$|Dockerfile|\.dockerignore$)'; then exit 0; fi
          build=$(cat BUILDNUM)
          [[ "$build" =~ ^[0-9]+$ ]]
          printf '%s\n' "$((10#$build + 1))" > BUILDNUM
          printf '\n' > PART
          git config user.email action@github.com
          git config user.name 'GitHub Action'
          export GIT_AUTHOR_DATE="$(git show -s --format=%aI "$MERGED_SHA")"
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          git add BUILDNUM PART
          git -c core.hooksPath=/dev/null commit -m "Prepare development build after PR $PR_NUMBER"
          git bundle create "$RUNNER_TEMP/build.bundle" HEAD
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=automation/build-$PR_NUMBER-$MERGED_SHA" >> "$GITHUB_OUTPUT"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.build.outputs.changed == 'true'
        with:
          name: build-number
          path: ${{ runner.temp }}/build.bundle
  review:
    needs: verify-changes
    if: needs.verify-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-number
          path: ${{ runner.temp }}
      - name: Publish only the metadata review branch
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.verify-changes.outputs.sha }}
          BRANCH: ${{ needs.verify-changes.outputs.branch }}
          MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git fetch "$RUNNER_TEMP/build.bundle" HEAD
          test "$(git rev-parse "$COMMIT^")" = "$MERGED_SHA"
          test "$(git ls-remote --refs origin refs/heads/develop | cut -f1)" = "$MERGED_SHA"
          files=$(git diff --name-only "$COMMIT^" "$COMMIT")
          test "$files" = "$(printf 'BUILDNUM\nPART')"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "$COMMIT:refs/heads/$BRANCH"
          if [ "$(gh pr list --head "$BRANCH" --base develop --json number --jq length)" -eq 0 ]; then
            gh pr create --draft --head "$BRANCH" --base develop --title 'Review development build number' --body 'Only BUILDNUM and PART change. Normal CI and branch protections apply. No prerelease or Docker publication is triggered.'
          fi
