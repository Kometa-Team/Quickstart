name: Route Dependency Updates

# Metadata only: never check out or execute pull request code with this token.
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

concurrency:
  group: dependency-route-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  route:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref != 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Create App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_TOKEN }}
          permission-pull-requests: write
      - name: Route security updates to integration
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo 'Dependency updates must first merge into develop. Perform a Master Release to propagate approved dependency changes to master.'
          if [ "$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')" = true ]; then
            gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --disable-auto
          fi
          gh api --method PATCH "repos/$REPOSITORY/pulls/$PR_NUMBER" -f base=develop > /dev/null
          test "$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.base.ref')" = develop
