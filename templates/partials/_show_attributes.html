<p>Configure various attributes for show collections.</p>

<!-- 🔹 Section: Separators -->
<div class="accordion mt-3" id="{{ library.id }}-separatorsAccordion">
  <div class="accordion-item">
    <h2 class="accordion-header">
      <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
        data-bs-target="#{{ library.id }}-collapseSeparators" aria-expanded="false"
        aria-controls="{{ library.id }}-collapseSeparators">
        Separators
      </button>
    </h2>
    <div id="{{ library.id }}-collapseSeparators" class="accordion-collapse collapse"
      data-bs-parent="#{{ library.id }}-separatorsAccordion">
      <div class="accordion-body">
        <div class="row">
          <!-- Left Column: Dropdown Selection -->
          <div class="col-md-6">
            <label for="{{ library.id }}-attribute_use_separators" class="form-label">
              Separator Style
              <span class="text-danger" data-bs-toggle="tooltip" data-bs-html="true" style="margin-left: 10px;" title="Separators are like index cards at a library, to categorize Collections in your library.<br><br>
                      To enable Separators for the Defaults Collections, select your style from the drop-down.<br><br>
                      <b>Warning</b>: Plex does not officially support blank collections, which is what separators are.
                      You may experience bugs if you enable Separators.">
                <i class="bi bi-info-circle-fill"></i>
              </span>
            </label>
            <select class="form-select" id="{{ library.id }}-attribute_use_separators"
              name="{{ library.id }}-template_variables[use_separators]">
              <option value="none" {% if data['libraries'].get(library.id ~ '-template_variables[use_separators]'
                , 'none' ) in ['false', None] %} selected {% endif %}>None</option>

              {% set selected_style = data['libraries'].get(library.id ~ '-template_variables[use_separators]', '') %}

              {% for style, value in {
              "Amethyst": "amethyst", "Aqua": "aqua", "Blue": "blue", "Brown": "stb",
              "Forest": "forest", "Fuchsia": "fuchsia", "Gold": "gold", "Gray": "gray",
              "Green": "green", "Navy": "navy", "Ocean": "ocean", "Olive": "olive",
              "Orchid": "orchid", "Original": "orig", "Pink": "pink", "Plum": "plum", "Purple": "purple",
              "Red": "red", "Rust": "rust", "Salmon": "salmon", "Sand": "sand",
              "Tan": "tan"
              }.items() %}
              <option value="{{ value }}" {% if selected_style==value %} selected {% endif %}>
                {{ style }}
              </option>
              {% endfor %}
            </select>
          </div>

          <!-- Right Column: Preview Image -->
          <div class="col-md-6 d-flex align-items-center justify-content-center">
            <div id="{{ library.id }}-separatorPreviewContainer" style="display: none;">
              <img id="{{ library.id }}-separatorPreviewImage" src="" alt="{{ library.id }} Separator Preview"
                class="img-fluid" style="max-width: 100%; height: auto; border: 1px solid #ccc;">
            </div>
          </div>
        </div>
      </div>
    </div>


  </div>
</div>
<!-- 🔹 Section: Overlay Operations -->
<div class="accordion mt-3" id="{{ library.id }}-overlayOperationsAccordion">
  <div class="accordion-item">
    <h2 class="accordion-header">
      <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
        data-bs-target="#{{ library.id }}-collapseOverlays" aria-expanded="false"
        aria-controls="{{ library.id }}-collapseOverlays">
        Overlay Operations
      </button>
    </h2>
    <div id="{{ library.id }}-collapseOverlays" class="accordion-collapse collapse"
      data-bs-parent="#{{ library.id }}-overlayOperationsAccordion">
      <div class="accordion-body">

        <!-- Remove Overlays Toggle -->
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="{{ library.id }}-attribute_remove_overlays"
            name="{{ library.id }}-attribute_remove_overlays" value="true" {% if data['libraries'][library.id
            ~ '-attribute_remove_overlays' ]|string|lower=='true' %}checked{% endif %}>
          <input type="hidden" name="{{ library.id }}-attribute_remove_overlays" value="false">
          <label class="form-check-label" for="{{ library.id }}-attribute_remove_overlays">
            <a href="https://kometa.wiki/en/{{ version_info.kometa_branch }}/config/libraries/#remove-overlays"
              target="_blank" rel="noopener noreferrer">Remove Overlays</a>
            <span class="text-info" data-bs-toggle="tooltip" data-bs-html="true" style="margin-left: 10px;"
              title="Remove Overlays will remove all overlays from your library. This toggle will take priority over any previous selections.">
              <i class="bi bi-info-circle-fill"></i>
            </span>
          </label>
        </div>

        <!-- Reset Overlays Dropdown -->
        <div class="col-md-6">
          <div class="input-group mb-2">
            <span class="input-group-text" id="{{ library.id }}-attribute_reset_overlays_text">
              <a href="https://kometa.wiki/en/{{ version_info.kometa_branch }}/config/libraries/#reset-overlays"
                target="_blank" rel="noopener noreferrer">Reset Overlays</a>
              <span class="text-danger" data-bs-toggle="tooltip" data-bs-html="true" style="margin-left: 10px;"
                title="Reset Overlays will grab a new base image from the source that you choose, and then use that as the source for applying your overlays.<br><br>
                                <b>Warning:</b> Once you have done a run with Reset Overlays, you should then set this value to None or remove the reset_overlays line(s) from your config.yml.
                                If you do not do this, you will end up in a loop of your overlays being removed, a new image grabbed, and your overlays reapplying.">
                <i class="bi bi-info-circle-fill"></i>
              </span>
            </span>
            <select class="form-select" id="{{ library.id }}-attribute_reset_overlays"
              name="{{ library.id }}-attribute_reset_overlays"
              aria-describedby="{{ library.id }}-attribute_reset_overlays_text">
              <option value="" {% if data['libraries'].get(library.id ~ '-attribute_reset_overlays' )=="" %}selected{%
                endif %}>
                None</option>
              <option value="tmdb" {% if data['libraries'].get(library.id ~ '-attribute_reset_overlays' )=="tmdb"
                %}selected{% endif %}>TMDb</option>
              <option value="plex" {% if data['libraries'].get(library.id ~ '-attribute_reset_overlays' )=="plex"
                %}selected{% endif %}>Plex</option>
            </select>
          </div>
        </div>

        <!-- Image Bloat Tip -->
        <p class="text-white">
          <span class="text-info">
            <b>Read this Tip:</b>
            <i class="bi bi-lightbulb-fill" data-bs-toggle="tooltip" data-bs-placement="top"
              data-bs-custom-class="text-tooltip"
              title="Using Reset Overlays or frequently Removing and Reapplying overlays will quickly result in Image Bloat. Neither Plex nor Kometa cleans up previously-used posters with overlays. Consider using ImageMaid to clean up old, unused images.">
            </i>
          </span>
          Using <a href="https://kometa.wiki/en/{{ version_info.kometa_branch }}/kometa/scripts/imagemaid"
            target="_blank">ImageMaid</a> can help clean up old, unused images.
        </p>

      </div>
    </div>
  </div>
</div>
<!-- 🔹 Section: Library Operations -->
<div class="accordion mt-3" id="{{ library.id }}-libraryOperationsAccordion">
  <div class="accordion-item">
    <h2 class="accordion-header">
      <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
        data-bs-target="#{{ library.id }}-collapseLibrary" aria-expanded="false"
        aria-controls="{{ library.id }}-collapseLibrary">
        Library Operations
      </button>
    </h2>
    <div id="{{ library.id }}-collapseLibrary" class="accordion-collapse collapse"
      data-bs-parent="#{{ library.id }}-libraryOperationsAccordion">
      <div class="accordion-body">

        <!-- update_blank_track_titles Toggle -->
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="{{ library.id }}-attribute_assets_for_all"
            name="{{ library.id }}-attribute_assets_for_all" value="true" {% if data['libraries'][library.id
            ~ '-attribute_assets_for_all' ]|string|lower=='true' %}checked{% endif %}>
          <input type="hidden" name="{{ library.id }}-attribute_assets_for_all" value="false">
          <label class="form-check-label" for="{{ library.id }}-attribute_assets_for_all">
            <a href="https://kometa.wiki/en/{{ version_info.kometa_branch }}/config/operations/#assets-for-all"
              target="_blank" rel="noopener noreferrer">Assets for All</a>
            <span class="text-info" data-bs-toggle="tooltip" data-bs-html="true" style="margin-left: 10px;"
              title="Searches asset directories for images for all items in the library">
              <i class="bi bi-info-circle-fill"></i>
            </span>
          </label>
        </div>

        <!-- mass_imdb_parental_labels Dropdown -->
        <div class="col-md-6">
          <div class="input-group mb-2">
            <span class="input-group-text" id="{{ library.id }}-attribute_mass_imdb_parental_labels_text">
              <a href="https://kometa.wiki/en/{{ version_info.kometa_branch }}/config/operations/#mass-imdb-parental-labels"
                target="_blank" rel="noopener noreferrer">Mass IMDb Parental Labels</a>
              <span class="text-info" data-bs-toggle="tooltip" data-bs-html="true" style="margin-left: 10px;"
                title="Adds IMDb Parental labels of every item in the library.">
                <i class="bi bi-info-circle-fill"></i>
              </span>
            </span>
            <select class="form-select" id="{{ library.id }}-attribute_mass_imdb_parental_labels"
              name="{{ library.id }}-attribute_mass_imdb_parental_labels"
              aria-describedby="{{ library.id }}-attribute_mass_imdb_parental_labels_text">
              <option value="" {% if data['libraries'].get(library.id ~ '-attribute_mass_imdb_parental_labels' )=="" %}selected{%
                endif %}>
                None</option>
              <option value="mild" {% if data['libraries'].get(library.id ~ '-attribute_mass_imdb_parental_labels' )=="mild"
                %}selected{% endif %}>Mild</option>
              <option value="moderate" {% if data['libraries'].get(library.id ~ '-attribute_mass_imdb_parental_labels' )=="moderate"
                %}selected{% endif %}>Moderate</option>
              <option value="severe" {% if data['libraries'].get(library.id ~ '-attribute_mass_imdb_parental_labels' )=="severe"
                %}selected{% endif %}>Severe</option>
            </select>
          </div>
        </div>

        <!-- mass_collection_mode Dropdown -->
        <div class="col-md-6">
          <div class="input-group mb-2">
            <span class="input-group-text" id="{{ library.id }}-attribute_mass_collection_mode_text">
              <a href="https://kometa.wiki/en/{{ version_info.kometa_branch }}/config/operations/#mass-collection-mode"
                target="_blank" rel="noopener noreferrer">Mass Collection Mode</a>
              <span class="text-info" data-bs-toggle="tooltip" data-bs-html="true" style="margin-left: 10px;"
                title="Updates the Collection Mode of every item in the library">
                <i class="bi bi-info-circle-fill"></i>
              </span>
            </span>
            <select class="form-select" id="{{ library.id }}-attribute_mass_collection_mode"
              name="{{ library.id }}-attribute_mass_collection_mode"
              aria-describedby="{{ library.id }}-attribute_mass_collection_mode_text">
              <option value="" {% if data['libraries'].get(library.id ~ '-attribute_mass_collection_mode' )=="default" %}selected{%
                endif %}>
                Default</option>
              <option value="hide" {% if data['libraries'].get(library.id ~ '-attribute_mass_collection_mode' )=="hide"
                %}selected{% endif %}>Hide</option>
              <option value="hide_items" {% if data['libraries'].get(library.id ~ '-attribute_mass_collection_mode' )=="hide_items"
                %}selected{% endif %}>Hide Items</option>
              <option value="show_items" {% if data['libraries'].get(library.id ~ '-attribute_mass_collection_mode' )=="show_items"
                %}selected{% endif %}>Show Items</option>
            </select>
          </div>
        </div>

        <!-- update_blank_track_titles Toggle -->
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="{{ library.id }}-attribute_update_blank_track_titles"
            name="{{ library.id }}-attribute_update_blank_track_titles" value="true" {% if data['libraries'][library.id
            ~ '-attribute_update_blank_track_titles' ]|string|lower=='true' %}checked{% endif %}>
          <input type="hidden" name="{{ library.id }}-attribute_update_blank_track_titles" value="false">
          <label class="form-check-label" for="{{ library.id }}-attribute_update_blank_track_titles">
            <a href="https://kometa.wiki/en/{{ version_info.kometa_branch }}/config/operations/#update-blank-track-titles"
              target="_blank" rel="noopener noreferrer">Update Blank Track Titles</a>
            <span class="text-info" data-bs-toggle="tooltip" data-bs-html="true" style="margin-left: 10px;"
              title="Updates blank track titles of every item in the library.">
              <i class="bi bi-info-circle-fill"></i>
            </span>
          </label>
        </div>

        <!-- remove_title_parentheses Toggle -->
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="{{ library.id }}-attribute_remove_title_parentheses"
            name="{{ library.id }}-attribute_remove_title_parentheses" value="true" {% if data['libraries'][library.id
            ~ '-attribute_remove_title_parentheses' ]|string|lower=='true' %}checked{% endif %}>
          <input type="hidden" name="{{ library.id }}-attribute_remove_title_parentheses" value="false">
          <label class="form-check-label" for="{{ library.id }}-attribute_remove_title_parentheses">
            <a href="https://kometa.wiki/en/{{ version_info.kometa_branch }}/config/operations/remove-title-parentheses"
              target="_blank" rel="noopener noreferrer">Remove Title Parentheses</a>
            <span class="text-info" data-bs-toggle="tooltip" data-bs-html="true" style="margin-left: 10px;"
              title="Removes title parentheses of every item in the library.">
              <i class="bi bi-info-circle-fill"></i>
            </span>
          </label>
        </div>

        <!-- split_duplicates Toggle -->
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="{{ library.id }}-attribute_split_duplicates"
            name="{{ library.id }}-attribute_split_duplicates" value="true" {% if data['libraries'][library.id
            ~ '-attribute_split_duplicates' ]|string|lower=='true' %}checked{% endif %}>
          <input type="hidden" name="{{ library.id }}-attribute_split_duplicates" value="false">
          <label class="form-check-label" for="{{ library.id }}-attribute_split_duplicates">
            <a href="https://kometa.wiki/en/{{ version_info.kometa_branch }}/config/operations/split-duplicates"
              target="_blank" rel="noopener noreferrer">Split Duplicates</a>
            <span class="text-info" data-bs-toggle="tooltip" data-bs-html="true" style="margin-left: 10px;"
              title="Splits all duplicate items found in this library.">
              <i class="bi bi-info-circle-fill"></i>
            </span>
          </label>
        </div>

        <!-- radarr_add_all Toggle -->
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="{{ library.id }}-attribute_radarr_add_all"
            name="{{ library.id }}-attribute_radarr_add_all" value="true" {% if data['libraries'][library.id
            ~ '-attribute_radarr_add_all' ]|string|lower=='true' %}checked{% endif %}>
          <input type="hidden" name="{{ library.id }}-attribute_radarr_add_all" value="false">
          <label class="form-check-label" for="{{ library.id }}-attribute_radarr_add_all">
            <a href="https://kometa.wiki/en/{{ version_info.kometa_branch }}/config/operations/radarr-add-all"
              target="_blank" rel="noopener noreferrer">Radarr Add All</a>
            <span class="text-info" data-bs-toggle="tooltip" data-bs-html="true" style="margin-left: 10px;"
              title="Adds every item in the library to Radarr.">
              <i class="bi bi-info-circle-fill"></i>
            </span>
          </label>
        </div>

        <!-- sonarr_add_all Toggle -->
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="{{ library.id }}-attribute_sonarr_add_all"
            name="{{ library.id }}-attribute_sonarr_add_all" value="true" {% if data['libraries'][library.id
            ~ '-attribute_sonarr_add_all' ]|string|lower=='true' %}checked{% endif %}>
          <input type="hidden" name="{{ library.id }}-attribute_sonarr_add_all" value="false">
          <label class="form-check-label" for="{{ library.id }}-attribute_sonarr_add_all">
            <a href="https://kometa.wiki/en/{{ version_info.kometa_branch }}/config/operations/sonarr-add-all"
              target="_blank" rel="noopener noreferrer">Sonarr Add All</a>
            <span class="text-info" data-bs-toggle="tooltip" data-bs-html="true" style="margin-left: 10px;"
              title="Adds every item in the library to Sonarr.">
              <i class="bi bi-info-circle-fill"></i>
            </span>
          </label>
        </div>



      </div>
    </div>
  </div>
</div>
