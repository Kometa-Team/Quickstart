<!-- Movie Library Selection -->
<div id="movie-libraries-container">
    <h3>Select Movie Libraries</h3>
    <div id="movieLibraries">
        {% set movie_libraries = plex_data['plex']['tmp_movie_libraries'].split(',')|sort if
        plex_data['plex']['tmp_movie_libraries'] else [] %}
        {% for library in movie_libraries %}
        <div class="form-check form-switch">
            <input class="form-check-input library-checkbox" type="checkbox" value="{{ library }}"
                id="mov-library_{{ library }}" name="mov-library_{{ library }}">
            <label class="form-check-label" for="mov-library_{{ library }}">{{ library }}</label>
        </div>
        {% endfor %}
    </div>
</div>
<!-- Movie Library Accordions -->
<div class="accordion mt-4" id="accordionMovies">
