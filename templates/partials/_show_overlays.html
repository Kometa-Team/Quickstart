<!-- Show Overlays Accordion -->
<div class="accordion-item">
  <h2 class="accordion-header">
    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#showOverlays"
      aria-expanded="false" aria-controls="showOverlays">
      Show Overlays
    </button>
  </h2>

  <div id="showOverlays" class="accordion-collapse collapse" data-bs-parent="#accordionShows">
    <div class="accordion-body">

      <!-- Preview Overlays Accordion -->

      <div class="accordion mt-3" id="sho-previewOverlaysAccordion">
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button" type="button" data-bs-toggle="collapse"
              data-bs-target="#sho-previewOverlays" aria-expanded="true" aria-controls="sho-previewOverlays">
              Preview Overlays
            </button>
          </h2>
          <div id="sho-previewOverlays" class="accordion-collapse collapse show"
            data-bs-parent="#sho-previewOverlaysAccordion">
            <div class="accordion-body">
              <div class="row">
                <!-- Left Column: Form Elements -->
                <div class="col-md-6">
                  <p class="mb-3">
                    Selecting any Overlays will automatically update the preview image here. You can upload your
                    custom base image from a file or a URL to preview your Overlays against that image.
                  </p>
                  <div class="form-floating mb-4">
                    <select id="sho-library-image-dropdown" class="form-select">
                      <option value="default">Default Kometa</option>
                    </select>
                    <label for="sho-library-image-dropdown">Select Custom Show Image</label>
                  </div>

                  <!-- Upload an image automatically when selected -->
                  <input type="file" id="sho-upload-library-image" accept="image/png, image/jpeg"
                    class="form-control mb-2">

                  <!-- Fetch an image from a URL -->
                  <div class="input-group mt-2">
                    <input type="url" id="sho-image-url" class="form-control" placeholder="Enter Image URL">
                    <button type="button" id="sho-fetch-url-btn" class="btn btn-secondary">Fetch</button>
                  </div>

                  <button type="button" id="sho-delete-image-btn" class="btn btn-danger mt-2">
                    <i class="bi bi-trash"></i> Delete Selected
                  </button>
                  <button type="button" id="sho-rename-image-btn" class="btn btn-warning mt-2">
                    <i class="fa fa-pencil-alt"></i> Rename Selected
                  </button>

                </div>

                <!-- Right Column: Image Preview -->
                <div class="col-md-6 d-flex align-items-center justify-content-center">
                  <img id="sho-preview-image" src="/config/previews/show_preview.png" class="img-fluid"
                    alt="Show Preview" style="max-width: 100%; height: auto; border: 1px solid #ccc;">
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>


      <!-- Chart Overlays Accordion -->
      <div class="accordion mt-3" id="sho-chartOverlaysAccordion">
        <div class="accordion-item">

              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="sho-overlay_streaming" name="sho-overlay_streaming"
                  value="true" {% if data['libraries']['sho-overlay_streaming']|string|lower=='true' %}checked{% endif
                  %}>
                <input type="hidden" name="sho-overlay_streaming" value="false">
                <div class="d-flex align-items-center">
                  <label class="form-check-label me-3" for="sho-overlay_streaming">
                    <a target="_blank"
                      href="https://kometa.wiki/en/{{ version_info.kometa_branch }}/defaults/overlays/streaming/">Streaming</a>
                  </label>
                  <i class="bi bi-search text-success me-3" data-bs-toggle="tooltip" data-bs-html="true"
                    title='<img src="https://kometa.wiki/en/{{ version_info.kometa_branch }}/defaults/overlays/images/streaming.png" height="300" style="opacity: 1;">'></i>
                  <i class="bi bi-exclamation-circle text-danger" data-bs-toggle="tooltip" data-bs-placement="top"
                    title="This will show content currently streaming on a particular service, not content that is exclusive to said service. Read the wiki for using `originals_only` to change this"></i>
                </div>
              </div>

              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="sho-overlay_studio" name="sho-overlay_studio"
                  value="true" {% if data['libraries']['sho-overlay_studio']|string|lower=='true' %}checked{% endif %}>
                <input type="hidden" name="sho-overlay_studio" value="false">
                <div class="d-flex align-items-center">
                  <label class="form-check-label me-3" for="sho-overlay_studio">
                    <a target="_blank"
                      href="https://kometa.wiki/en/{{ version_info.kometa_branch }}/defaults/overlays/studio/">Studio</a>
                  </label>
                  <i class="bi bi-search text-success me-3" data-bs-toggle="tooltip" data-bs-html="true"
                    title='<img src="https://kometa.wiki/en/{{ version_info.kometa_branch }}/defaults/overlays/images/studio.png" height="300" style="opacity: 1;">'></i>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>
      <!-- Utility Overlays Accordion -->
      <div class="accordion mt-3" id="sho-utilityOverlaysAccordion">
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
              data-bs-target="#sho-utilityOverlays" aria-expanded="false" aria-controls="sho-utilityOverlays">
              Utility Overlays
            </button>
          </h2>
          <div id="sho-utilityOverlays" class="accordion-collapse collapse"
            data-bs-parent="#sho-utilityOverlaysAccordion">
            <div class="accordion-body">
              <!-- Utility Overlay Toggles -->
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="sho-overlay_direct_play"
                  name="sho-overlay_direct_play" value="true" {% if
                  data['libraries']['sho-overlay_direct_play']|string|lower=='true' %}checked{% endif %}>
                <input type="hidden" name="sho-overlay_direct_play" value="false">
                <div class="d-flex align-items-center">
                  <label class="form-check-label me-3" for="sho-overlay_direct_play">
                    <a target="_blank"
                      href="https://kometa.wiki/en/{{ version_info.kometa_branch }}/defaults/overlays/direct_play/">Direct
                      Play Only</a>
                  </label>
                  <i class="bi bi-search text-success me-3" data-bs-toggle="tooltip" data-bs-html="true"
                    title='<img src="https://kometa.wiki/en/{{ version_info.kometa_branch }}/defaults/overlays/images/direct_play.png" height="300" style="opacity: 1;">'></i>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
